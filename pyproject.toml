[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lyapunov-shield"
version = "2.0.0"
description = "Exact-Z/Q Neural Lyapunov, Bouligand Barrier & Filippov Safety Shield"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Bob Preece"},
]
dependencies = []

[project.scripts]
lyapunov-shield = "lyapunov_shield.cli:main"

[tool.setuptools.packages.find]
include = ["lyapunov_shield*"]
